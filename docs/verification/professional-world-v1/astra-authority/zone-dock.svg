<text x="1116" y="304" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[24, 28]  route/context</text>
<text x="40" y="900" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FUNCTION AND HIERARCHY</text>
<text x="40" y="928" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Pressure-safe transfer from shuttle to station; identity check and controls practice</text>
<text x="40" y="950" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">before assessment. Docking sleeve, reinforced glass, baggage rollers, ribbed metal</text>
<text x="40" y="972" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">floor.</text>
<text x="800" y="928" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Landmark: South berth glazing / shuttle. Quiet space: weather window /</text>
<text x="800" y="950" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">bench. Beyond initial view: Northern station vestibule extends above</text>
<text x="800" y="972" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">initial view. Shuttle remains one legible boundary landmark.</text>
<text x="40" y="1040" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">COLLISION / CAMERA / RESTORATION</text>
<text x="40" y="1068" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Main spine4 tiles/128 px; secondary and doors3 tiles/96 px. Actual player32×42 px.</text>
<text x="40" y="1090" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Footprint blocks only its visible base; overhead cap uses an authored contact anchor.</text>
<text x="40" y="1112" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Camera clamped to room, never to task result.</text>
<text x="800" y="1068" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Crew state: Loose cover beside sealed exterior berth. Crew secures the same</text>
<text x="800" y="1090" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">exterior cover. No new primary opportunity. Existing entry state and</text>
<text x="800" y="1112" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">handover triggers retained.</text>
<text x="40" y="1360" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FIXED CREW CHANGE / dock-weather-cover</text>
