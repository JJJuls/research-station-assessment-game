<text x="1116" y="304" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[10, 18]  route/context</text>
<text x="40" y="900" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FUNCTION AND HIERARCHY</text>
<text x="40" y="928" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Confirm stable shared operation and return to Qualtrics with restrained closure.</text>
<text x="40" y="950" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Vertical Core cylinder inside an orthogonal protective collar, broad open approach and</text>
<text x="40" y="972" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">perimeter bypass.</text>
<text x="800" y="928" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Landmark: Core column and protective collar. Quiet space: observation rail.</text>
<text x="800" y="950" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Beyond initial view: The top service collar extends slightly beyond initial</text>
<text x="800" y="972" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">south entry; no empty margins.</text>
<text x="40" y="1040" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">COLLISION / CAMERA / RESTORATION</text>
<text x="40" y="1068" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Main spine4 tiles/128 px; secondary and doors3 tiles/96 px. Actual player32×42 px.</text>
<text x="40" y="1090" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Footprint blocks only its visible base; overhead cap uses an authored contact anchor.</text>
<text x="40" y="1112" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Camera clamped to room, never to task result.</text>
<text x="800" y="1068" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Crew state: Core exterior status lamp on fixed standby. Lamp holds steady</text>
<text x="800" y="1090" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">at existing sync completion. No score, trait, comparative praise or new</text>
<text x="800" y="1112" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">primary event. Return to Utility always available; final handoff uses</text>
<text x="800" y="1134" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">existing semantics.</text>
<text x="40" y="1360" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FIXED CREW CHANGE / core-status-lamp</text>
