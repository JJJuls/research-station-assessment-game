<text x="40" y="854.3636363636364" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Dashed: initial40×22.5 view. Open circle: operating approach. Dot: incoming spawn.</text>
<text x="1090" y="166" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">OPERATING FACES / TILE CONTACT</text>
<text x="1090" y="200" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">01  Core synchronisation</text>
<text x="1116" y="218" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[22, 14]  route/context</text>
