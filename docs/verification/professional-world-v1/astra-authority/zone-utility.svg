<text x="1116" y="304" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[13, 27]  route/context</text>
<text x="1090" y="329" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">04  Calibration breaker</text>
<text x="1116" y="347" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[34, 27]  route/context</text>
<text x="1090" y="372" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">05  Distribution bus</text>
<text x="1116" y="390" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[46, 27]  route/context</text>
<text x="40" y="900" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FUNCTION AND HIERARCHY</text>
<text x="40" y="928" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Close primary observation windows, then bring shared services up in a fixed non-scored</text>
<text x="40" y="950" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">sequence. One visible pipe/cable trunk joining three service bays to the Core riser.</text>
<text x="800" y="928" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Landmark: Continuous systems trunk. Quiet space: crew rest recess. Beyond</text>
<text x="800" y="950" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">initial view: Upper Core vestibule and manifold extend beyond entry view;</text>
<text x="800" y="972" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">three feed bays remain distinct.</text>
<text x="40" y="1040" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">COLLISION / CAMERA / RESTORATION</text>
<text x="40" y="1068" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Main spine4 tiles/128 px; secondary and doors3 tiles/96 px. Actual player32×42 px.</text>
<text x="40" y="1090" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Footprint blocks only its visible base; overhead cap uses an authored contact anchor.</text>
<text x="40" y="1112" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Camera clamped to room, never to task result.</text>
<text x="800" y="1068" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Crew state: Trunk outer maintenance cover open. Cover closes when existing</text>
<text x="800" y="1090" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">fixed feeds are ready. No new primary measure. Record review closes</text>
<text x="800" y="1112" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">unresolved opportunities with existing dispositions;</text>
<text x="800" y="1134" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">coolant→calibration→distribution order is closure only.</text>
<text x="40" y="1360" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">FIXED CREW CHANGE / trunk-service-cover</text>
