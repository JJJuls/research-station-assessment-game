<text x="40" y="838.6896551724138" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Dashed: initial40×22.5 view. Open circle: operating approach. Dot: incoming spawn.</text>
<text x="1090" y="166" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">OPERATING FACES / TILE CONTACT</text>
<text x="1090" y="200" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">01  Close station record</text>
<text x="1116" y="218" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[12, 11]  route/context</text>
<text x="1090" y="243" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">02  System manifold overview</text>
<text x="1116" y="261" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">[20, 11]  route/context</text>
