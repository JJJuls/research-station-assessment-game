<text x="1298" y="524" fill="#f4f3ec" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400">E / Space — Inspect terminal</text>
<text x="1280" y="603" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">Face folded away, cover</text>
<text x="1280" y="626" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">parked, no bright active</text>
<text x="1280" y="649" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">screen or repeated demand.</text>
<text x="40" y="755" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">MEASUREMENT EXCEPTION IS EXPLICIT</text>
<text x="40" y="791" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Optional cleanup and unsolicited initiation retain their approved quiet presentation. Accepted commitments keep their existing reminder</text>
<text x="40" y="815" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">exposure until owner disposition. A required-route grammar must never turn M03/M04/M05/M09/M10 into a compelled “good participant”</text>
<text x="40" y="839" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">response.</text>
<text x="40" y="958" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400">Original analytical blockout • labels are reviewer annotations • no commercial-game imagery</text>
