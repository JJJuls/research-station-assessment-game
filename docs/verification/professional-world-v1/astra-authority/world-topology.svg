<text x="40" y="940" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">A / OPERATIONS TREE — SELECTED</text>
<text x="40" y="975" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">Relief handover → records → independent signal incident → exterior</text>
<text x="40" y="998" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">recovery → purposeful return → Utility/Core. Existing cardinal</text>
<text x="40" y="1021" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">adjacency and exit windows remain intact.</text>
<text x="830" y="940" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">B / SERVICE RING — REJECTED</text>
<text x="830" y="975" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">Distributed salvage expedition uses Records–Lab and Yard–Utility</text>
<text x="830" y="998" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">links. Credible logistics, but alternative exits change watch,</text>
<text x="830" y="1021" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400">promise and return exposure. Requires new owner authority.</text>
<text x="40" y="1108" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400">Original analytical blockout • labels are reviewer annotations • no commercial-game imagery</text>
