<text x="40" y="742" fill="#18232c" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Render order</text>
<text x="40" y="780" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Floor → decals → low infrastructure → foot-sorted props and actors → foreground wall</text>
<text x="40" y="804" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">caps → UI. Current depth saturates near 1980 world px; selected zone heights stay</text>
<text x="40" y="828" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">below that, but replace saturation with a stable depth mapping during camera/render</text>
<text x="40" y="852" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">work.</text>
<text x="900" y="780" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Red dashed base is collision, not the entire transparent</text>
<text x="900" y="804" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">image. North overhang may occlude behind; the south operating</text>
<text x="900" y="828" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">face and required path stay visible. Never use addDecor for a</text>
<text x="900" y="852" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">solid object in a required lane.</text>
<text x="40" y="1028" fill="#52616a" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400">Original analytical blockout • labels are reviewer annotations • no commercial-game imagery</text>
